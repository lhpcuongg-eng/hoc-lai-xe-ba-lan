# =================================================================
# Netlify Configuration
# Project: Học Lái Xe Ba Lan (Polish Driving Test App)
# =================================================================

[build]
  # Site is a static single-page HTML application — no build step needed.
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

# =================================================================
# Redirects & Headers — SPA-friendly
# =================================================================
# All routes should fall back to index.html (single-page app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# =================================================================
# Security Headers
# =================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets aggressively
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# =================================================================
# Context — Production
# =================================================================
[context.production]
  command = ""
  publish = "."

# =================================================================
# Context — Deploy Previews (PR branches)
# =================================================================
[context.deploy-preview]
  command = ""
  publish = "."

# =================================================================
# Context — Branch Deploys
# =================================================================
[context.branch-deploy]
  command = ""
  publish = "."
