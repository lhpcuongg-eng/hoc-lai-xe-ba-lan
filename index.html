<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Lái Xe Ba Lan - Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        h1 { color: #3b82f6; text-align: center; }
        .loading { text-align: center; padding: 50px; color: #666; }
        .loading:after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }
        .question { margin-top: 20px; }
        .question-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
        .option { padding: 12px; margin: 8px 0; background: #f0f9ff; border-radius: 8px; cursor: pointer; }
        .option:hover { background: #e0f2fe; }
        .option.correct { background: #dcfce7; }
        .option.wrong { background: #fee2e2; }
        .btn { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .btn:disabled { background: #ccc; }
        .error { color: red; padding: 20px; text-align: center; background: #fee2e2; border-radius: 8px; margin-top: 20px; }
        .stats { text-align: center; margin-top: 20px; color: #666; }
        .debug { background: #f0f0f0; padding: 10px; margin-top: 20px; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Học Lái Xe Ba Lan</h1>
        <div id="app"></div>
    </div>

    <script>
        // ===== THAY THẾ BẰNG API CỦA BẠN =====
        const SUPABASE_URL = 'https://dktpzhjuscawnfkxxkof.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrdHB6aGp1c2Nhd25ma3h4a29mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTcwNDEsImV4cCI6MjEwMDk5MzA0MX0.h2_3FD3jwsoWH6trazOMayXd9ItqznC6UtcEHXUPyCs';
        // ========================================

        const app = document.getElementById('app');
        let questions = [];
        let currentIndex = 0;
        let score = 0;

        function showLoading() {
            app.innerHTML = '<div class="loading">Đang tải câu hỏi</div>';
        }

        function showError(message) {
            app.innerHTML = `<div class="error"><strong>Lỗi:</strong><br>${message}</div>`;
        }

        function showDebug(info) {
            console.log(info);
        }

        function renderQuestion() {
            if (questions.length === 0) {
                showError('Không có câu hỏi nào!');
                return;
            }

            const q = questions[currentIndex];
            const isSpecial = q.question_type === 'special';
            const options = isSpecial 
                ? ['A', 'B', 'C'].map((letter, i) => ({ letter, key: `option_${String.fromCharCode(97+i)}_pl` }))
                : ['Đúng', 'Sai'].map((text, i) => ({ letter: i === 0 ? 'Đ' : 'S', text }));

            app.innerHTML = `
                <div class="stats">
                    Câu ${currentIndex + 1} / ${questions.length} | 
                    Điểm: ${score}
                </div>
                <div class="question">
                    <div style="color: ${isSpecial ? '#f59e0b' : '#3b82f6'}; font-weight: bold; margin-bottom: 10px;">
                        ${isSpecial ? 'Câu chuyên ngành' : 'Câu cơ bản'}
                    </div>
                    <div class="question-text">${q.question_pl || q.question_vi || 'Không có nội dung'}</div>
                    ${options.map(opt => `
                        <div class="option" onclick="checkAnswer('${opt.letter}')">${opt.letter}. ${opt.text || q[opt.key + '_pl'] || ''}</div>
                    `).join('')}
                </div>
                <button class="btn" onclick="nextQuestion()" ${currentIndex >= questions.length - 1 ? 'disabled' : ''}>
                    ${currentIndex >= questions.length - 1 ? 'Hết rồi!' : 'Câu tiếp theo'}
                </button>
            `;
        }

        window.checkAnswer = function(answer) {
            const q = questions[currentIndex];
            const correct = (q.correct_answer || '').toUpperCase();
            
            document.querySelectorAll('.option').forEach(el => {
                el.style.pointerEvents = 'none';
                const letter = el.textContent[0];
                if (letter === correct) el.classList.add('correct');
                else if (letter === answer && answer !== correct) el.classList.add('wrong');
            });

            if (answer === correct) score++;
        };

        window.nextQuestion = function() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        };

        async function init() {
            showLoading();
            showDebug('Bắt đầu kết nối Supabase...');
            
            if (SUPABASE_URL === 'YOUR_SUPABASE_URL' || SUPABASE_KEY === 'YOUR_SUPABASE_ANON_KEY') {
                showError('Chưa cấu hình Supabase!<br>Vui lòng cập nhật SUPABASE_URL và SUPABASE_KEY trong code.');
                return;
            }

            try {
                const { createClient } = supabase;
                const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
                showDebug('Đã tạo Supabase client');

                showDebug('Đang fetch questions...');
                const { data, error, status } = await sb
                    .from('questions')
                    .select('*')
                    .limit(10);

                showDebug('Response status: ' + status);
                showDebug('Data: ' + JSON.stringify(data));
                showDebug('Error: ' + JSON.stringify(error));

                if (error) throw error;
                if (!data || data.length === 0) {
                    showError('Không có dữ liệu trong bảng questions!<br>Hãy thêm dữ liệu vào Supabase.');
                    return;
                }

                questions = data;
                showDebug('Tải thành công ' + questions.length + ' câu hỏi');
                renderQuestion();

            } catch (err) {
                showDebug('Catch error: ' + err.message);
                showError(`Lỗi kết nối: ${err.message}`);
            }
        }

        init();
    </script>
</body>
</html>
